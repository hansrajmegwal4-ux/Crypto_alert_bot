name: 🙏 Hansraj meghwal 🙏

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EMA Bot
        env:
          TELEGRAM_BOT_TOKEN: "8963851584:AAHDD47K5Q20qAURgsBloMQhBwMfUhdyrxM"
          TELEGRAM_CHAT_ID: "6292189019"
        run: python ema_strategy_bot.py

      - name: Run Sweep Bot V2
        env:
          TELEGRAM_BOT_TOKEN: "8963851584:AAHDD47K5Q20qAURgsBloMQhBwMfUhdyrxM"
          TELEGRAM_CHAT_ID: "6292189019"
          PYTHONWARNINGS: ignore::FutureWarning
        run: python sweep_bot_v2.py

      - name: Run Commodity Sweep Bot
        env:
          TELEGRAM_BOT_TOKEN: "8963851584:AAHDD47K5Q20qAURgsBloMQhBwMfUhdyrxM"
          TELEGRAM_CHAT_ID: "6292189019"
        run: python commodity_sweep_bot/bot.py

      - name: Stop repeat notifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json || true
          git add commodity_sweep_bot/commodity_sweep_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Stop repeat notifications"
            git push
          fi
