name: 👑 Hansraj meghwal 👑

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EMA Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ema_strategy_bot.py

      - name: Run Sweep Bot V2 (Gold & Crude Oil)
        env:
          TELEGRAM_BOT_TOKEN: "8963851584:AAHDD47K5Q20qAURgsBIoMQhBwMfUhdyrxM"
          TELEGRAM_CHAT_ID: "6292189019"
          PYTHONWARNINGS: ignore::FutureWarning
        run: python sweep_bot_v2.py
